openapi: 3.0.3
info:
  title: Metamorph API
  version: "1"
  description: |
    The contract the web and Android apps depend on. Servers and the apps' TypeScript types are generated from this
    file (`make generate`). Request bodies are decoded leniently on purpose: a field the server does not know is
    ignored, and where a field is optional, `null` means "leave it as it is" unless the field is documented as clearable.
security:
  - bearerAuth: []

paths:
  # --- feature paths: each feature adds its operations in its own block, between these markers ---
  # >>> bodyweights
  /body-weights:
    get:
      operationId: listBodyWeights
      tags: [body-weights]
      summary: The signed-in user's weigh-ins, oldest first (at most 5000, the newest kept).
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200":
          description: Weigh-ins.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/BodyWeightEntry" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /body-weights/{date}:
    parameters:
      - { name: date, in: path, required: true, schema: { type: string, format: date } }
    put:
      operationId: setBodyWeight
      tags: [body-weights]
      summary: Records (or replaces) the weigh-in for a local calendar day.
      description: |
        One entry per user per day. The date is the person's own local date, so it may be as far ahead as UTC+14 but
        no further. The weight is rounded half-to-even to two decimals and must be above 0 and below 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weight_kg]
              properties:
                weight_kg: { type: number, format: double }
      responses:
        "200":
          description: The stored entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BodyWeightEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: deleteBodyWeight
      tags: [body-weights]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  # <<< bodyweights
  # >>> account
  # <<< account
  # >>> gyms
  # <<< gyms
  # >>> exercises
  # <<< exercises
  # >>> workouts
  # <<< workouts
  # >>> stats
  /stats/consistency:
    get:
      operationId: getStatsConsistency
      tags: [stats]
      summary: Activity per local day over the last weeks weeks, and week streaks over all history.
      description: |
        A day is the calendar date in the workout's own time zone (the account's when the workout has none). Only
        workouts with a logged set count; warm-up sets are left out of sets and volume. The window starts on the
        Monday `weeks - 1` weeks before this week's Monday and ends today in the account's zone. `weeks` is clamped
        to 1..104 (default 53).
      parameters:
        - { name: weeks, in: query, required: false, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: The calendar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsistencyResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /stats/exercises:
    get:
      operationId: listStatsExercises
      tags: [stats]
      summary: The exercises the user has logged a working set of, one row per variant, most recently performed first.
      responses:
        "200":
          description: Logged exercises.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/StatsLoggedExercise" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /stats/exercises/{id}/progress:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getStatsExerciseProgress
      tags: [stats]
      summary: One exercise's history, a point per session, with the records across them.
      description: |
        Only official exercises and the caller's own are visible (404 otherwise); a merged exercise resolves to its
        target. Without `variant_key` every variation is combined; with it (even empty, meaning untagged) exactly
        that variant. Records go to the earliest session on a tie.
      parameters:
        - { name: variant_key, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  # <<< stats

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }

  responses:
    BadRequest:
      description: The request is invalid.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Missing, invalid or expired access token, or the account no longer exists.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: No such record (or it belongs to someone else).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code:
          type: string
          description: A stable value a client can branch on, present only where the API documents one.
    # --- feature schemas: each feature adds its schemas in its own block ---
    # >>> bodyweights
    BodyWeightEntry:
      type: object
      required: [date, weight_kg]
      properties:
        date: { type: string, format: date }
        weight_kg: { type: number, format: double }
    # <<< bodyweights
    # >>> account
    # <<< account
    # >>> gyms
    # <<< gyms
    # >>> exercises
    # <<< exercises
    # >>> workouts
    # <<< workouts
    # >>> stats
    ConsistencyDay:
      type: object
      required: [date, workouts, sets, volume_kg]
      properties:
        date: { type: string, format: date }
        workouts: { type: integer, format: int64 }
        sets: { type: integer, format: int64 }
        volume_kg: { type: number, format: double }
    ConsistencyTotals:
      type: object
      required: [workouts, active_days, sets, volume_kg]
      properties:
        workouts: { type: integer, format: int64 }
        active_days: { type: integer, format: int64 }
        sets: { type: integer, format: int64 }
        volume_kg: { type: number, format: double }
    ConsistencyStreak:
      type: object
      required: [current_weeks, longest_weeks]
      properties:
        current_weeks: { type: integer, format: int64 }
        longest_weeks: { type: integer, format: int64 }
    ConsistencyResponse:
      type: object
      required: [timezone, from, to, days, totals, streak]
      properties:
        timezone: { type: string }
        from: { type: string, format: date, description: Monday of the first week shown. }
        to: { type: string, format: date, description: Today in the account's zone (inclusive). }
        days: { type: array, items: { $ref: "#/components/schemas/ConsistencyDay" }, description: Only days with a workout, ascending. }
        totals: { $ref: "#/components/schemas/ConsistencyTotals" }
        streak: { $ref: "#/components/schemas/ConsistencyStreak" }
    StatsLoggedExercise:
      type: object
      required: [exercise_id, name, kind, variant_key, variant_label, sessions, last_performed]
      properties:
        exercise_id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string }
        variant_key: { type: string, description: Empty means untagged. }
        variant_label: { type: string }
        sessions: { type: integer, format: int64 }
        last_performed: { type: string, format: date }
    ProgressPoint:
      type: object
      description: One session. A figure that does not apply to the exercise's kind is null.
      required: [date, workout_id, sets, volume_kg, top_weight_kg, best_e1rm_kg, top_reps, total_reps, best_duration_s, total_duration_s, best_distance_m, total_distance_m]
      properties:
        date: { type: string, format: date }
        workout_id: { type: string, format: uuid }
        sets: { type: integer, format: int64 }
        volume_kg: { type: number, format: double, nullable: true }
        top_weight_kg: { type: number, format: double, nullable: true }
        best_e1rm_kg: { type: number, format: double, nullable: true }
        top_reps: { type: integer, format: int32, nullable: true }
        total_reps: { type: integer, format: int64, nullable: true }
        best_duration_s: { type: integer, format: int32, nullable: true }
        total_duration_s: { type: integer, format: int64, nullable: true }
        best_distance_m: { type: number, format: double, nullable: true }
        total_distance_m: { type: number, format: double, nullable: true }
    ProgressNumberRecord:
      type: object
      required: [value, date]
      properties:
        value: { type: number, format: double }
        date: { type: string, format: date }
    ProgressCountRecord:
      type: object
      required: [value, date]
      properties:
        value: { type: integer, format: int32 }
        date: { type: string, format: date }
    ProgressRecords:
      type: object
      required: [top_weight_kg, best_e1rm_kg, best_volume_kg, top_reps, best_duration_s, best_distance_m]
      properties:
        top_weight_kg: { allOf: [{ $ref: "#/components/schemas/ProgressNumberRecord" }], nullable: true }
        best_e1rm_kg: { allOf: [{ $ref: "#/components/schemas/ProgressNumberRecord" }], nullable: true }
        best_volume_kg: { allOf: [{ $ref: "#/components/schemas/ProgressNumberRecord" }], nullable: true }
        top_reps: { allOf: [{ $ref: "#/components/schemas/ProgressCountRecord" }], nullable: true }
        best_duration_s: { allOf: [{ $ref: "#/components/schemas/ProgressCountRecord" }], nullable: true }
        best_distance_m: { allOf: [{ $ref: "#/components/schemas/ProgressNumberRecord" }], nullable: true }
    ProgressResponse:
      type: object
      required: [exercise_id, name, kind, variant_key, points, records]
      properties:
        exercise_id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string }
        variant_key: { type: string, nullable: true, description: Null when every variant is combined, else the key echoed back. }
        points: { type: array, items: { $ref: "#/components/schemas/ProgressPoint" } }
        records: { $ref: "#/components/schemas/ProgressRecords" }
    # <<< stats
