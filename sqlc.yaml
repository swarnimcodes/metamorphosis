version: "2"
sql:
  - engine: postgresql
    schema: migrations   # goose-annotated files; sqlc reads only the Up parts
    queries: queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - { db_type: citext, go_type: string }
          - { db_type: citext, nullable: true, go_type: { type: string, pointer: true } }
          - { db_type: uuid, go_type: github.com/google/uuid.UUID }
          - { db_type: uuid, nullable: true, go_type: github.com/google/uuid.NullUUID }
          # Weights and distances are decimals, never floats. (`pg_catalog.numeric`: plain `numeric` is silently ignored.)
          - { db_type: pg_catalog.numeric, go_type: github.com/shopspring/decimal.Decimal }
          - { db_type: pg_catalog.numeric, nullable: true, go_type: github.com/shopspring/decimal.NullDecimal }
          - { db_type: timestamptz, go_type: time.Time }
          - { db_type: timestamptz, nullable: true, go_type: { type: time.Time, pointer: true } }
          - { db_type: date, go_type: time.Time }
          - { db_type: date, nullable: true, go_type: { type: time.Time, pointer: true } }
